    chips('mp', MAPS, 'map'); chips('wx', WX, 'wx'); chips('bk', [['darex','Darex 250'], ['bmw', unl() ? 'BMW S1000RR' : 'BMW S1000RR 🔒', !unl()]], 'bike');
    sws('cb', ['#2f6bff','#f6f8ff','#ff5fae','#3ddc97','#ffb454'], 'body'); sws('ch', ['#111118','#f6f8ff','#ff5fae','#2f6bff'], 'helmet'); sws('hn', ['','#ff5fae','#6fa8ff','#ffb454'], 'horns'); sws('hx', ['#15151b','#f6f8ff','#ff5fae','#6f7a8c'], 'hoodie');
    const m = [['Казань: проехать 1000 м', P.kd, 1000], ['Собрать 30 ♥ за один заезд', P.hr, 30], ['Проехать 600 м под дождём', P.rd, 600]];
    $('ms').innerHTML = m.map(a => '<div class="mi">' + a[0] + ' <b>' + Math.min(a[1], a[2]) + ' / ' + a[2] + '</b><div class="bar"><i style="width:' + Math.min(100, a[1] / a[2] * 100) + '%"></i></div></div>').join('') + '<p class="sub">' + (unl() ? 'BMW S1000RR открыт, он уже в гараже 🏁' : 'Выполни все три, и в гараже появится BMW S1000RR') + '</p>';
  }
  function tab(t){ ['home','gar','mis'].forEach(i => $(i).hidden = i !== t); }
  $('bGar').onclick = () => tab('gar'); $('bMis').onclick = () => tab('mis'); $('bBack1').onclick = $('bBack2').onclick = () => tab('home');
  function pause(){ if (mode !== 'play' || paused) return; paused = true; $('pz').hidden = false; }
  function resume(){ if (!paused) return; paused = false; $('pz').hidden = true; last = performance.now(); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  $('bRes').onclick = resume; $('bMn2').onclick = () => { resume(); toMenu(); };
  $('bPlay').onclick = start; $('bAgain').onclick = start; $('bMenu').onclick = toMenu; $('hm').onclick = pause;

  // ---------- input ----------
  const cv = $('c'); let sx0, sy0, st0 = 0, sw = 0;
  cv.addEventListener('pointerdown', e => { sx0 = e.clientX; sy0 = e.clientY; st0 = performance.now(); sw = 0; if (mode === 'menu' && e.clientY < innerHeight * .5 && Math.abs(e.clientX - innerWidth / 2) < innerWidth * .3 && ++ec % 5 === 0){ wt = 1.2; say('Газуем! 🏍️💨'); } });
  cv.addEventListener('pointermove', e => { if (mode !== 'play' || sw || sx0 == null) return; const dx = e.clientX - sx0, dy = e.clientY - sy0; if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)){ go(dx > 0 ? 1 : -1); sw = 1; } else if (dy < -30){ jumpReq = true; sw = 1; } });
  cv.addEventListener('pointerup', () => { if (mode === 'play' && !sw && performance.now() - st0 < 260) jumpReq = true; sx0 = null; });
  addEventListener('keydown', e => { if (e.repeat) return; if (e.code === 'ArrowLeft' || e.code === 'KeyA') go(-1); else if (e.code === 'ArrowRight' || e.code === 'KeyD') go(1); else if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)){ e.preventDefault(); jumpReq = true; } });

  setQ(); swap(); buildWorld(); view(); ui(); tab('home'); requestAnimationFrame(frame);
</script>
